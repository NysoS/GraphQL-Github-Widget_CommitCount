# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  # Permet d'exécuter la CI à intervalle régulier (ex: tous les jours à minuit)
  schedule:
    - cron: "0 0 * * *"
  # Permet de lancer le workflow manuellement depuis GitHub
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Exec
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: npm run dev --if-present

      - name: Commit et Push du SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add *.svg README.md

          # Le '|| exit 0' permet d'éviter que la CI échoue si le SVG n'a pas changé
          git commit -m "chore: auto-update Counter_svg_commit.svg [skip ci]" || exit 0

          git push

      - name: Purger le cache Camo (Sans action externe)
        run: |
          URL="https://raw.githubusercontent.com/NysoS/GraphQL-Github-Widget_CommitCount/main/Counter_svg_commit.svg"
          HEX=$(echo -n "$URL" | xxd -p | tr -d '\n')
          CAMO_URL="https://camo.githubusercontent.com/$HEX"
          echo "Purge de $CAMO_URL"
          curl -s -X PURGE "$CAMO_URL"
